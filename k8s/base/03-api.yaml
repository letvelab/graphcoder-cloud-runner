apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphcoder-api
  namespace: graphcoder
spec:
  replicas: 1

  selector:
    matchLabels:
      app: graphcoder-api

  template:
    metadata:
      labels:
        app: graphcoder-api

    spec:
      containers:
        - name: api
          image: graphcoder-api:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: graphcoder-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: graphcoder-api
  namespace: graphcoder
spec:
  type: ClusterIP

  selector:
    app: graphcoder-api

  ports:
    - name: http
      port: 80
      targetPort: 8000
