[project]
name = "graphcoder-cloud-runner"
version = "0.1.0"
description = "Cloud-native GraphCoder runner on Kubernetes and AWS EKS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["apps", "packages", "tests"]

[tool.pytest.ini_options]
pythonpath = [
    "apps/api/src",
    "apps/worker/src",
    "packages/common/src",
]
testpaths = ["tests"]
